name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/config.toml"
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-functions.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: yyldnatfhzobyeqnvqjv

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ESV Edge Function
        run: supabase functions deploy esv-passage --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy API.Bible Edge Function
        run: supabase functions deploy api-bible-passage --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy YouVersion Edge Function
        run: supabase functions deploy youversion-passage --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy Verse of the Day Edge Function
        run: supabase functions deploy verse-of-the-day --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy Push Subscription Edge Function
        run: supabase functions deploy push-subscriptions --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy Push Sender Edge Function
        run: supabase functions deploy send-push-notifications --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
