name: Check app release version

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-app-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify app release version
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:app-version -- "$BASE_SHA"
