    <script>
      (function applyInitialTheme() {
        const presets = {
          light: ["paper", "parchment", "clarity", "dawn", "meadow", "blush", "lavender", "sapphire", "opal"],
          dark: ["midnight", "chapel", "aurora", "rose-night", "violet-night", "nocturne", "contrast"],
        };
        const defaults = { light: "sapphire", dark: "aurora" };
        const chromeColors = {
          paper: "#f8f7f3",
          parchment: "#f3ecdd",
          clarity: "#f5f7f8",
          dawn: "#f7ead2",
          meadow: "#e5f0d8",
          blush: "#f8e5ee",
          lavender: "#eae3fb",
          sapphire: "#dbeafe",
          opal: "#dcecff",
          midnight: "#111827",
          chapel: "#12100d",
          aurora: "#111d37",
          "rose-night": "#281323",
          "violet-night": "#1d1735",
          nocturne: "#07111f",
          contrast: "#000000",
        };
        const systemQuery = window.matchMedia?.("(prefers-color-scheme: dark)");
        const savedMode = localStorage.getItem("lw_theme");
        const theme = savedMode === "light" || savedMode === "dark" ? savedMode : systemQuery?.matches ? "dark" : "light";
        const savedPreset = localStorage.getItem(`lw_theme_preset_${theme}`);
        const preset = presets[theme].includes(savedPreset) ? savedPreset : defaults[theme];
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreset = preset;
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", chromeColors[preset] || chromeColors[defaults[theme]]);
      })();
    </script>
