// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Keep generated resources out of Documents/node_modules, where duplicate
// copies such as "values 2.xml" have repeatedly broken resource merging.
// Isolate checkouts and modules; Android Studio reads output paths from Gradle.
def checkoutBuildKey = rootProject.projectDir.canonicalPath.digest('SHA-256').take(16)
def localBuildRoot = new File(gradle.gradleUserHomeDir, "bigscreenbible-builds/${checkoutBuildKey}")

allprojects {
    layout.buildDirectory.set(new File(localBuildRoot, project.path == ':' ? 'root' : project.path.substring(1).replace(':', '/')))
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
