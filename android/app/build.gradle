apply plugin: 'com.android.application'

android {
    namespace = "com.bigscreenbible.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bigscreenbible.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // DataStore 1.2.1 fixes 16 KB RELRO alignment in its native shared counter.
    implementation "androidx.datastore:datastore-preferences:1.2.1"
    implementation "androidx.browser:browser:1.9.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Do not produce a Play release with silently disabled Firebase delivery.
tasks.register('verifyReleasePushConfiguration') {
    doLast {
        def configFile = file('google-services.json')
        if (!configFile.exists()) {
            throw new GradleException('Android push requires android/app/google-services.json. See ANDROID-PUSH-SETUP.md.')
        }
        def config = new groovy.json.JsonSlurper().parse(configFile)
        if (!config.client.any { it.client_info?.android_client_info?.package_name == android.defaultConfig.applicationId }) {
            throw new GradleException('google-services.json must contain the Android package com.bigscreenbible.app.')
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') task.dependsOn('verifyReleasePushConfiguration')
}

// Synced Documents folders can accumulate "name 2.ext" copies after cap copy.
// Snapshot assets into the unsynced Gradle build directory and exclude only
// numbered copies with an existing canonical file and no authored counterpart.
def originalAppAssets = file('src/main/assets')
def packagedAppAssets = layout.buildDirectory.dir('generated/cleanAppAssets')
def stageCleanAppAssets = tasks.register('stageCleanAppAssets', Sync) {
    from(originalAppAssets)
    into(packagedAppAssets)
    exclude { details ->
        if (details.isDirectory()) return false
        def relative = details.relativePath.pathString
        if (details.file.name == '.DS_Store') return true
        if (!relative.startsWith('public/')) return false
        def canonical = relative.replaceFirst(/ \d+(\.[^\/.]+)$/, '$1')
        if (canonical == relative || !new File(originalAppAssets, canonical).isFile()) return false
        def authored = rootProject.file('../' + relative.substring('public/'.length()))
        return !authored.exists()
    }
}
android.sourceSets.main.assets.setSrcDirs([packagedAppAssets])
tasks.named('preBuild').configure { dependsOn(stageCleanAppAssets) }
